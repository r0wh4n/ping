<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ping</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #000; color: #f2f2f4; font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { height: 100%; display: grid; place-content: center; gap: 10px; padding: 0 24px; text-align: center; }
  .dot { width: 14px; height: 14px; margin: 0 auto 10px; border-radius: 50%; background: #fff; box-shadow: 0 0 24px rgba(255, 255, 255, 0.35); }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  p { margin: 0; color: #8a8a93; }
  a { justify-self: center; margin-top: 14px; padding: 12px 22px; border-radius: 999px; background: #f2f2f4; color: #000; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <div class="dot"></div>
  <h1>You're offline</h1>
  <p>Ping needs a connection to load your chats.</p>
  <a href="https://theping.chat/app">Try again</a>
</main>
</body>
</html>
