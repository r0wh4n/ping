# Force patched versions of build/dev-time transitive deps flagged by `pnpm audit`
# (postcss/nanoid/source-map-js = build, brace-expansion/js-yaml/minimatch/zod =
# eslint, sharp = image gen). New pins are exact releases at least two weeks old.
overrides:
  postcss: ">=8.5.23"
  nanoid: ">=3.3.18"
  sharp: "0.35.5"
  source-map-js: "1.2.2"
  # @eslint/eslintrc asks for ^4; only the 5.x line has the merge-key CPU bug.
  js-yaml: "4.3.2"
  zod: "4.6.7"
  "@typescript-eslint/typescript-estree>minimatch": "11.0.5"
  # Pin each major exactly: an open ">=1.1.21" resolves to the highest version
  # on the registry (5.x), whose export is not callable, which breaks
  # minimatch@3's `require('brace-expansion')(...)` and kills eslint.
  "brace-expansion@1": "1.1.21"
  "brace-expansion@5": "5.0.12"
  # three.quarks depends on quarks.core "*"; pin it to the release that
  # matches three.quarks rather than whatever was published last.
  quarks.core: "0.17.1"
  # Pulled in by @react-three/*; held to releases at least two weeks old.
  n8ao: "2.0.1"
  "@babel/runtime": "7.29.13"
  # Pulled in by @capacitor/cli; held to releases at least two weeks old.
  "@capacitor/cli>tar": "7.5.22"
  "rimraf@6>glob": "14.0.4"
  "glob@14>minimatch": "11.0.5"

# Allow native build scripts (prebuilt binaries otherwise skipped).
allowBuilds:
  sharp: true
  unrs-resolver: true
