# Force patched versions of build/dev-time transitive deps flagged by `pnpm audit`
# (postcss/nanoid = build, brace-expansion/js-yaml = eslint, sharp = image gen).
# None are runtime-exploitable in the deployed app; this just clears the advisories.
overrides:
  postcss: ">=8.5.23"
  nanoid: ">=3.3.18"
  sharp: ">=0.35.0"
  js-yaml: ">=4.3.1"
  # Replacement ranges MUST be bounded: an open ">=1.1.18" resolves to the
  # highest version on the registry (5.x), whose export is not callable, which
  # breaks minimatch@3's `require('brace-expansion')(...)` and kills eslint.
  "brace-expansion@<1.1.18": ">=1.1.18 <2"
  "brace-expansion@>=4.0.0 <5.0.9": ">=5.0.9 <6"
  # three.quarks depends on quarks.core "*"; pin it to the release that
  # matches three.quarks rather than whatever was published last.
  quarks.core: "0.17.1"
  # Pulled in by @react-three/*; held to releases at least two weeks old.
  n8ao: "2.0.1"
  "@babel/runtime": "7.29.13"

# Allow native build scripts (prebuilt binaries otherwise skipped).
allowBuilds:
  sharp: true
  unrs-resolver: true
