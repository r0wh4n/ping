# coturn for Ping calls. Credentials are minted per call by /turn, so this
# server holds only the shared secret — there are no user accounts here.
listening-port=3478
tls-listening-port=5349

fingerprint
use-auth-secret
# static-auth-secret and realm come from the environment (see docker-compose).

# Relay only. Without these a TURN server will happily forward traffic to your
# own private network on a caller's behalf, which turns it into an SSRF proxy.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Keep one abusive client from eating the box.
user-quota=12
total-quota=300

no-cli
syslog
